<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI-SkinLab - AI 기반 정밀 피부 분석 솔루션. IoT 스마트폰 AI 센서를 통한 피부 분석 및 관리" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>AI-SkinLab | AI 기반 피부 분석</title>
  </head>
  <body>
    <!-- 피부 이미지 표시용 선명도(언샤프) 필터 — 라이브/폴백 공통. 밝기 유지(k2+k3=1). -->
    <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <filter id="skinSharpen" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k1="0" k2="2.2" k3="-1.2" k4="0" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
